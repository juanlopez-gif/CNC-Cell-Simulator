<svg xmlns="http://www.w3.org/2000/svg" class="dg-root" viewBox="0 0 844 818" width="844" height="818" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" role="img" aria-label="State diagram: Conveyor"><style>
