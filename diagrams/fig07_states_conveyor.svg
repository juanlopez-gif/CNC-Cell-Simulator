</style><rect class="dg-bg" x="0" y="0" width="844" height="818"/><text class="dg-title" x="20" y="36">State diagram: Conveyor</text><text class="dg-sub" x="20" y="58">Robots pick or place at the belt only when it is stopped (<tspan class="dg-tag">ENC-43</tspan> = 0); the belt starts only when both robots are clear.</text><rect class="dg-band dg-band-stop" x="100" y="127" width="408" height="212" rx="7"/><text class="dg-band-label stop" x="490" y="233" text-anchor="middle" transform="rotate(-90 490 233)" dy="4">BELT STOPPED</text><rect class="dg-band dg-band-move" x="100" y="364" width="408" height="197" rx="7"/><text class="dg-band-label move" x="490" y="525.5" text-anchor="middle" transform="rotate(-90 490 525.5)" dy="4">BELT MOVING</text><rect class="dg-band dg-band-stop" x="100" y="586" width="408" height="86" rx="7"/><text class="dg-band-label stop" x="490" y="629" text-anchor="middle" transform="rotate(-90 490 629)" dy="4">STOPPED</text><g class="dg-trg"><path class="dg-tr" d="M290 93 L290 130"/><polygon class="dg-head" points="290,135 294.5,125.5 285.5,125.5"/></g><g class="dg-trg"><path class="dg-tr" d="M290 205 L290 256"/><polygon class="dg-head" points="290,261 294.5,251.5 285.5,251.5"/></g><g class="dg-trg"><path class="dg-tr" d="M290 331 L290 367"/><polygon class="dg-head" points="290,372 294.5,362.5 285.5,362.5"/></g><g class="dg-trg"><path class="dg-tr" d="M290 442 L290 493"/><polygon class="dg-head" points="290,498 294.5,488.5 285.5,488.5"/></g><g class="dg-trg"><path class="dg-tr" d="M290 553 L290 589"/><polygon class="dg-head" points="290,594 294.5,584.5 285.5,584.5"/></g><g class="dg-trg"><path class="dg-tr" d="M290 664 L290 699 Q290 708 281 708 L47 708 Q38 708 38 699 L38 189 Q38 180 47 180 L105 180"/><polygon class="dg-head" points="110,180 100.5,175.5 100.5,184.5"/></g><g class="dg-trg dg-trk-fault"><path class="dg-tr" d="M470 394 L569 394"/><polygon class="dg-head" points="574,394 564.5,389.5 564.5,398.5"/></g><g class="dg-trg dg-trk-hold"><path class="dg-tr dg-dash" d="M532 170 L569 170"/><polygon class="dg-head" points="574,170 564.5,165.5 564.5,174.5"/></g><circle class="dg-init" cx="290" cy="86" r="7.5"/><g class="dg-state" data-state="C1"><rect class="dg-st-rect" x="110" y="135" width="360" height="70" rx="9"/><rect class="dg-st-chip" x="120" y="144" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="133.6" y="157.5" text-anchor="middle">C1</text><text class="dg-st-title" x="155.2" y="158.5">EMPTY - STOPPED</text><text class="dg-st-do" x="122" y="180">Belt stopped (<tspan class="dg-tag">ENC-43</tspan> = 0)</text><text class="dg-st-do" x="122" y="195">Robot 1 may place a part at the entry</text></g><g class="dg-state" data-state="C2"><rect class="dg-st-rect" x="110" y="261" width="360" height="70" rx="9"/><rect class="dg-st-chip" x="120" y="270" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="133.6" y="283.5" text-anchor="middle">C2</text><text class="dg-st-title" x="155.2" y="284.5">PART AT ENTRY</text><text class="dg-st-do" x="122" y="306">Belt still stopped · wait for the</text><text class="dg-st-do" x="122" y="321">transport permissives</text></g><g class="dg-state" data-state="C3"><rect class="dg-st-rect" x="110" y="372" width="360" height="70" rx="9"/><rect class="dg-st-chip" x="120" y="381" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="133.6" y="394.5" text-anchor="middle">C3</text><text class="dg-st-title" x="155.2" y="395.5">TRANSPORTING</text><text class="dg-st-do" x="122" y="417">Motor ON · <tspan class="dg-tag">ENC-43</tspan> must count pulses</text><text class="dg-st-do" x="122" y="432">within 1 s · exit reached within 15 s</text></g><g class="dg-state" data-state="C4"><rect class="dg-st-rect" x="110" y="498" width="360" height="55" rx="9"/><rect class="dg-st-chip" x="120" y="507" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="133.6" y="520.5" text-anchor="middle">C4</text><text class="dg-st-title" x="155.2" y="521.5">STOPPING</text><text class="dg-st-do" x="122" y="543">Motor OFF · wait for zero speed</text></g><g class="dg-state" data-state="C5"><rect class="dg-st-rect" x="110" y="594" width="360" height="70" rx="9"/><rect class="dg-st-chip" x="120" y="603" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="133.6" y="616.5" text-anchor="middle">C5</text><text class="dg-st-title" x="155.2" y="617.5">PART AT EXIT - READY TO PICK</text><text class="dg-st-do" x="122" y="639"><tspan class="dg-cp">CP-3</tspan> part at exit (<tspan class="dg-tag">PE-42</tspan> + <tspan class="dg-tag">CAM-2</tspan>) ·</text><text class="dg-st-do" x="122" y="654"><tspan class="dg-tag">CAM-2</tspan> pick pose · "pick allowed" to R2</text></g><g class="dg-state dg-k-fault" data-state="F"><rect class="dg-st-rect" x="574" y="366" width="250" height="85" rx="9"/><rect class="dg-st-chip" x="584" y="375" width="19.6" height="19" rx="4"/><text class="dg-st-chiptext" x="593.8" y="388.5" text-anchor="middle">F</text><text class="dg-st-title" x="611.6" y="389.5">FAULT</text><text class="dg-st-do" x="586" y="411">No <tspan class="dg-tag">ENC-43</tspan> pulses within 1 s</text><text class="dg-st-do" x="586" y="426">(belt / drive), or no <tspan class="dg-tag">PE-42</tspan></text><text class="dg-st-do" x="586" y="441">within 15 s (jam, lost part)</text></g><g class="dg-state dg-k-hold" data-state="H"><rect class="dg-st-rect" x="574" y="135" width="250" height="70" rx="9"/><rect class="dg-st-chip" x="584" y="144" width="19.6" height="19" rx="4"/><text class="dg-st-chiptext" x="593.8" y="157.5" text-anchor="middle">H</text><text class="dg-st-title" x="611.6" y="158.5">HOLD (LINE STOP)</text><text class="dg-st-do" x="586" y="180">A running transport finishes at</text><text class="dg-st-do" x="586" y="195">the stop; no new transport starts</text></g><rect class="dg-note-rect" x="20" y="750" width="804" height="50" rx="6"/><text class="dg-note" x="32" y="773"><tspan class="dg-b">Stop logic:</tspan> stopping uses <tspan class="dg-b">OR</tspan> (<tspan class="dg-tag">PE-42</tspan> or <tspan class="dg-tag">CAM-2</tspan>) because stopping is the safe direction;</text><text class="dg-note" x="32" y="789">confirming the part for the pick uses the cross-check <tspan class="dg-cp">CP-3</tspan> (both must agree, otherwise the camera decides).</text><text class="dg-guard dg-halo" x="290" y="118.5" text-anchor="middle"><tspan x="290">Start-up: <tspan class="dg-cp">CP-2</tspan> and <tspan class="dg-cp">CP-3</tspan> clear</tspan></text><text class="dg-guard dg-halo" x="290" y="230" text-anchor="middle"><tspan x="290">Robot 1 "part placed" · <tspan class="dg-cp">CP-2</tspan> part present</tspan><tspan x="290" dy="15">(<tspan class="dg-tag">PE-41</tspan> + <tspan class="dg-tag">CAM-1</tspan>)</tspan></text><text class="dg-guard dg-halo" x="290" y="356" text-anchor="middle"><tspan x="290">R1 and R2 clear of conveyor · <tspan class="dg-cp">CP-3</tspan> exit clear</tspan></text><text class="dg-guard dg-halo" x="290" y="467" text-anchor="middle"><tspan x="290">Part at the end stop: <tspan class="dg-tag">PE-42</tspan> ON or <tspan class="dg-tag">CAM-2</tspan> sees it</tspan><tspan x="290" dy="15">(either source is enough to stop the belt)</tspan></text><text class="dg-guard dg-halo" x="290" y="578" text-anchor="middle"><tspan x="290"><tspan class="dg-tag">ENC-43</tspan> zero speed for 0.2 s</tspan></text><text class="dg-guard dg-halo" x="190" y="705" text-anchor="middle"><tspan x="190">Robot 2 picked: <tspan class="dg-tag">GR-51</tspan> grip OK</tspan><tspan x="190" dy="15"><tspan class="dg-cp">CP-3</tspan> exit clear · R2 clear of conveyor</tspan></text></svg>