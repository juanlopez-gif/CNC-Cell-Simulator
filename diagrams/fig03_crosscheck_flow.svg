</style><rect class="dg-bg" x="0" y="0" width="860" height="1019"/><text class="dg-title" x="20" y="36">Camera + proximity cross-check (runs at every checkpoint CP-1 … CP-5)</text><text class="dg-sub" x="20" y="58">Both sources must agree. If they disagree the camera decides; 3 disagreements within 10 minutes stop the line.</text><g class="dg-trg"><path class="dg-tr" d="M440 152 L440 177"/><polygon class="dg-head" points="440,182 444.5,172.5 435.5,172.5"/></g><g class="dg-trg"><path class="dg-tr" d="M440 252 L440 277"/><polygon class="dg-head" points="440,282 444.5,272.5 435.5,272.5"/></g><g class="dg-trg dg-trk-fault"><path class="dg-tr" d="M318 322 L245 322"/><polygon class="dg-head" points="240,322 249.5,326.5 249.5,317.5"/></g><g class="dg-trg"><path class="dg-tr" d="M129 350 L129 375"/><polygon class="dg-head" points="129,380 133.5,370.5 124.5,370.5"/></g><g class="dg-trg dg-trk-fault"><path class="dg-tr" d="M129 446 L129 477"/><polygon class="dg-head" points="129,482 133.5,472.5 124.5,472.5"/></g><g class="dg-trg"><path class="dg-tr" d="M440 362 L440 438"/><polygon class="dg-head" points="440,443 444.5,433.5 435.5,433.5"/></g><g class="dg-trg"><path class="dg-tr" d="M214 413 L432 413"/><polygon class="dg-head" points="437,413 427.5,408.5 427.5,417.5"/></g><g class="dg-trg dg-trk-ok"><path class="dg-tr" d="M571 487 L627 487"/><polygon class="dg-head" points="632,487 622.5,482.5 622.5,491.5"/></g><g class="dg-trg dg-trk-fault"><path class="dg-tr" d="M440 531 L440 566"/><polygon class="dg-head" points="440,571 444.5,561.5 435.5,561.5"/></g><g class="dg-trg"><path class="dg-tr" d="M440 661 L440 686"/><polygon class="dg-head" points="440,691 444.5,681.5 435.5,681.5"/></g><g class="dg-trg"><path class="dg-tr" d="M440 749 L440 774"/><polygon class="dg-head" points="440,779 444.5,769.5 435.5,769.5"/></g><g class="dg-trg"><path class="dg-tr" d="M578 825 L627 825"/><polygon class="dg-head" points="632,825 622.5,820.5 622.5,829.5"/></g><g class="dg-trg dg-trk-fault"><path class="dg-tr" d="M440 871 L440 906"/><polygon class="dg-head" points="440,911 444.5,901.5 435.5,901.5"/></g><g class="dg-nodeg" data-state="N1"><rect class="dg-node check" x="280" y="82" width="320" height="70" rx="24"/><text class="dg-node-t" x="440" y="106.5" text-anchor="middle">CHECKPOINT CP-n REACHED</text><text class="dg-node-s" x="440" y="122" text-anchor="middle">scene static: robot out of the ROI,</text><text class="dg-node-s" x="440" y="137.5" text-anchor="middle">belt stopped · wait 0.3 s</text></g><g class="dg-nodeg" data-state="N2"><rect class="dg-node " x="280" y="182" width="320" height="70" rx="6"/><text class="dg-node-t" x="440" y="206.5" text-anchor="middle">READ BOTH SOURCES</text><text class="dg-node-s" x="440" y="222" text-anchor="middle">proximity sensor (debounced 50 ms)</text><text class="dg-node-s" x="440" y="237.5" text-anchor="middle">camera snapshot of the same ROI</text></g><g class="dg-choiceg" data-state="Q1"><polygon class="dg-choice" points="440,282 562,322 440,362 318,322"/><text class="dg-choice-t" x="440" y="319.5" text-anchor="middle">Camera image</text><text class="dg-choice-t" x="440" y="334.5" text-anchor="middle">valid?</text></g><g class="dg-nodeg" data-state="R1"><rect class="dg-node " x="18" y="294" width="222" height="56" rx="6"/><text class="dg-node-t" x="129" y="319.3" text-anchor="middle">RE-TRIGGER ONCE</text><text class="dg-node-s" x="129" y="334.8" text-anchor="middle">new image of the same ROI</text></g><g class="dg-choiceg" data-state="Q1B"><polygon class="dg-choice" points="129,380 214,413 129,446 44,413"/><text class="dg-choice-t" x="129" y="418" text-anchor="middle">Valid now?</text></g><g class="dg-nodeg" data-state="CF"><rect class="dg-node stop" x="18" y="482" width="222" height="86" rx="24"/><text class="dg-node-t" x="129" y="506.8" text-anchor="middle">CAMERA FAULT</text><text class="dg-node-t" x="129" y="522.3" text-anchor="middle">→ LINE STOP</text><text class="dg-node-s" x="129" y="537.8" text-anchor="middle">the camera is the reference,</text><text class="dg-node-s" x="129" y="553.3" text-anchor="middle">so the line never runs blind</text></g><g class="dg-choiceg" data-state="Q2"><polygon class="dg-choice" points="440,443 571,487 440,531 309,487"/><text class="dg-choice-t" x="440" y="484.5" text-anchor="middle">Proximity</text><text class="dg-choice-t" x="440" y="499.5" text-anchor="middle">= Camera?</text></g><g class="dg-nodeg" data-state="AG"><rect class="dg-node ok" x="632" y="451" width="212" height="72" rx="24"/><text class="dg-node-t" x="738" y="476.5" text-anchor="middle">AGREE</text><text class="dg-node-s" x="738" y="492" text-anchor="middle">use the value, the</text><text class="dg-node-s" x="738" y="507.5" text-anchor="middle">sequence continues</text></g><g class="dg-nodeg" data-state="MM"><rect class="dg-node warn" x="280" y="571" width="320" height="90" rx="6"/><text class="dg-node-t" x="440" y="597.8" text-anchor="middle">MISMATCH</text><text class="dg-node-t" x="440" y="613.3" text-anchor="middle">USE THE CAMERA VALUE</text><text class="dg-node-s" x="440" y="628.8" text-anchor="middle">log time, CP and both readings</text><text class="dg-node-s" x="440" y="644.3" text-anchor="middle">amber light · HMI names the sensor</text></g><g class="dg-nodeg" data-state="WN"><rect class="dg-node " x="280" y="691" width="320" height="58" rx="6"/><text class="dg-node-t" x="440" y="717.3" text-anchor="middle">ADD TO THE 10-MIN WINDOW</text><text class="dg-node-s" x="440" y="732.8" text-anchor="middle">events older than 10 min drop out</text></g><g class="dg-choiceg" data-state="Q3"><polygon class="dg-choice" points="440,779 578,825 440,871 302,825"/><text class="dg-choice-t" x="440" y="822.5" text-anchor="middle">≥ 3 mismatches</text><text class="dg-choice-t" x="440" y="837.5" text-anchor="middle">in the last 10 min?</text></g><g class="dg-nodeg" data-state="CN"><rect class="dg-node warn" x="632" y="789" width="212" height="72" rx="24"/><text class="dg-node-t" x="738" y="814.5" text-anchor="middle">CONTINUE</text><text class="dg-node-s" x="738" y="830" text-anchor="middle">with the camera value,</text><text class="dg-node-s" x="738" y="845.5" text-anchor="middle">warning stays active</text></g><g class="dg-nodeg" data-state="LS"><rect class="dg-node stop" x="280" y="911" width="320" height="88" rx="24"/><text class="dg-node-t" x="440" y="936.8" text-anchor="middle">LINE STOP</text><text class="dg-node-t" x="440" y="952.3" text-anchor="middle">SENSOR VERIFICATION</text><text class="dg-node-s" x="440" y="967.8" text-anchor="middle">controlled stop · red light</text><text class="dg-node-s" x="440" y="983.3" text-anchor="middle">(see the supervisor states)</text></g><text class="dg-guard dg-halo dg-small" x="576" y="311.5" text-anchor="start"><tspan x="576">valid = frame received,</tspan><tspan x="576" dy="15">exposure OK, calibration</tspan><tspan x="576" dy="15">marks found</tspan></text><text class="dg-guard dg-halo" x="279" y="313.5" text-anchor="middle"><tspan x="279">No</tspan></text><text class="dg-guard dg-halo" x="143" y="468.5" text-anchor="start"><tspan x="143">No</tspan></text><text class="dg-guard dg-halo" x="454" y="382.5" text-anchor="start"><tspan x="454">Yes</tspan></text><text class="dg-guard dg-halo" x="317" y="404.5" text-anchor="middle"><tspan x="317">Yes</tspan></text><text class="dg-guard dg-halo" x="601.5" y="478.5" text-anchor="middle"><tspan x="601.5">Yes</tspan></text><text class="dg-guard dg-halo" x="454" y="555.5" text-anchor="start"><tspan x="454">No</tspan></text><text class="dg-guard dg-halo" x="605" y="816.5" text-anchor="middle"><tspan x="605">No</tspan></text><text class="dg-guard dg-halo" x="454" y="895.5" text-anchor="start"><tspan x="454">Yes</tspan></text></svg>