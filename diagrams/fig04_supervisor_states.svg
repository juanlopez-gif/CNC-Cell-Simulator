</style><rect class="dg-bg" x="0" y="0" width="860" height="536"/><text class="dg-title" x="20" y="36">State diagram: cross-check supervisor (camera vs proximity)</text><text class="dg-sub" x="20" y="58">Runs in parallel with the other state machines and counts disagreements in a 10-minute sliding window.</text><g class="dg-trg"><path class="dg-tr" d="M30 98 L30 139 Q30 147 38 147 L55 147"/><polygon class="dg-head" points="60,147 50.5,142.5 50.5,151.5"/></g><g class="dg-trg"><path class="dg-tr" d="M360 133 L495 133"/><polygon class="dg-head" points="500,133 490.5,128.5 490.5,137.5"/></g><g class="dg-trg"><path class="dg-tr" d="M500 161 L365 161"/><polygon class="dg-head" points="360,161 369.5,165.5 369.5,156.5"/></g><g class="dg-trg"><path class="dg-tr" d="M750 112 L750 97 Q750 88 759 88 L813 88 Q822 88 822 97 L822 138.5 Q822 147 813.5 147 L805 147"/><polygon class="dg-head" points="800,147 809.5,151.5 809.5,142.5"/></g><g class="dg-trg dg-trk-fault"><path class="dg-tr" d="M650 182 L650 357"/><polygon class="dg-head" points="650,362 654.5,352.5 645.5,352.5"/></g><g class="dg-trg dg-trk-fault"><path class="dg-tr" d="M280 182 L280 289 Q280 298 289 298 L551 298 Q560 298 560 307 L560 357"/><polygon class="dg-head" points="560,362 564.5,352.5 555.5,352.5"/></g><g class="dg-trg"><path class="dg-tr" d="M500 397 L365 397"/><polygon class="dg-head" points="360,397 369.5,401.5 369.5,392.5"/></g><g class="dg-trg dg-trk-ok"><path class="dg-tr" d="M140 362 L140 187"/><polygon class="dg-head" points="140,182 135.5,191.5 144.5,191.5"/></g><g class="dg-trg"><path class="dg-tr" d="M110 432 L110 451 Q110 460 119 460 L191 460 Q200 460 200 451 L200 437"/><polygon class="dg-head" points="200,432 195.5,441.5 204.5,441.5"/></g><g class="dg-state dg-k-ok" data-state="X1"><rect class="dg-st-rect" x="60" y="112" width="300" height="70" rx="9"/><rect class="dg-st-chip" x="70" y="121" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="83.6" y="134.5" text-anchor="middle">X1</text><text class="dg-st-title" x="105.2" y="135.5">NORMAL</text><text class="dg-st-do" x="72" y="157">All checkpoints agree</text><text class="dg-st-do" x="72" y="172">stack light <tspan class="dg-tag">LT-01</tspan> green</text></g><g class="dg-state dg-k-warn" data-state="X2"><rect class="dg-st-rect" x="500" y="112" width="300" height="70" rx="9"/><rect class="dg-st-chip" x="510" y="121" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="523.6" y="134.5" text-anchor="middle">X2</text><text class="dg-st-title" x="545.2" y="135.5">MISMATCH WARNING</text><text class="dg-st-do" x="512" y="157">1–2 mismatches in the last 10 min</text><text class="dg-st-do" x="512" y="172">camera value used · amber flashing</text></g><g class="dg-state dg-k-stop" data-state="X3"><rect class="dg-st-rect" x="500" y="362" width="300" height="70" rx="9"/><rect class="dg-st-chip" x="510" y="371" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="523.6" y="384.5" text-anchor="middle">X3</text><text class="dg-st-title" x="545.2" y="385.5">LINE STOP</text><text class="dg-st-do" x="512" y="407">Controlled stop: CNC ends its cycle,</text><text class="dg-st-do" x="512" y="422">robots park, belt stops · red light</text></g><g class="dg-state dg-k-check" data-state="X4"><rect class="dg-st-rect" x="60" y="362" width="300" height="70" rx="9"/><rect class="dg-st-chip" x="70" y="371" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="83.6" y="384.5" text-anchor="middle">X4</text><text class="dg-st-title" x="105.2" y="385.5">SENSOR VERIFICATION</text><text class="dg-st-do" x="72" y="407">Technician cleans and aligns sensors,</text><text class="dg-st-do" x="72" y="422">tests each CP, checks camera calibration</text></g><circle class="dg-init" cx="30" cy="90" r="7.5"/><rect class="dg-note-rect" x="500" y="454" width="300" height="66" rx="6"/><text class="dg-note" x="512" y="477"><tspan class="dg-b">The camera never overrides safety:</tspan></text><text class="dg-note" x="512" y="493">door interlock, E-stops and scanners</text><text class="dg-note" x="512" y="509">stay hardwired to the safety relay.</text><text class="dg-guard dg-halo" x="430" y="121.5" text-anchor="middle"><tspan x="430">mismatch at any CP</tspan></text><text class="dg-guard dg-halo" x="430" y="188" text-anchor="middle"><tspan x="430">no mismatch for</tspan><tspan x="430" dy="15">10 min (window empty)</tspan></text><text class="dg-guard dg-halo" x="760" y="80.5" text-anchor="middle"><tspan x="760">mismatch, count &lt; 3</tspan></text><text class="dg-guard dg-halo" x="650" y="269" text-anchor="middle"><tspan x="650">3rd mismatch</tspan><tspan x="650" dy="15">within 10 min</tspan></text><text class="dg-guard dg-halo" x="420" y="302.5" text-anchor="middle"><tspan x="420">camera fault (after 1 retry)</tspan></text><text class="dg-guard dg-halo" x="430" y="424" text-anchor="middle"><tspan x="430">all stopped · technician</tspan><tspan x="430" dy="15">starts the check</tspan></text><text class="dg-guard dg-halo" x="140" y="251.5" text-anchor="middle"><tspan x="140">all CP tests pass ·</tspan><tspan x="140" dy="15">operator reset →</tspan><tspan x="140" dy="15">counter cleared</tspan></text><text class="dg-guard dg-halo" x="155" y="480.5" text-anchor="middle"><tspan x="155">test fails → repair or replace the sensor, re-test</tspan></text></svg>