</style><rect class="dg-bg" x="0" y="0" width="860" height="538"/><text class="dg-title" x="20" y="36">State diagram: cross-check supervisor (camera vs proximity)</text><text class="dg-sub" x="20" y="58">Runs in parallel with the other state machines and counts disagreements in a 10-minute sliding window.</text><g class="dg-trg"><path class="dg-tr" d="M20 98 L20 139.5 Q20 147 27.5 147 L35 147"/><polygon class="dg-head" points="40,147 30.5,142.5 30.5,151.5"/></g><g class="dg-trg dg-trk-fault" data-tr="X1&gt;X3"><path class="dg-tr" d="M260 182 L260 289 Q260 298 269 298 L320.6 298"/><path class="dg-tr" d="M519.4 298 L571 298 Q580 298 580 307 L580 357"/><polygon class="dg-head" points="580,362 584.5,352.5 575.5,352.5"/></g><g class="dg-trg" data-tr="X1&gt;X2"><path class="dg-tr" d="M340 133 L515 133"/><polygon class="dg-head" points="520,133 510.5,128.5 510.5,137.5"/></g><g class="dg-trg dg-trk-fault" data-tr="X2&gt;X3"><path class="dg-tr" d="M670 182 L670 255"/><path class="dg-tr" d="M670 289 L670 357"/><polygon class="dg-head" points="670,362 674.5,352.5 665.5,352.5"/></g><g class="dg-trg dg-trk-ok" data-tr="X2&gt;X1"><path class="dg-tr" d="M520 161 L345 161"/><polygon class="dg-head" points="340,161 349.5,165.5 349.5,156.5"/></g><g class="dg-trg" data-tr="X3&gt;X4"><path class="dg-tr" d="M520 397 L345 397"/><polygon class="dg-head" points="340,397 349.5,401.5 349.5,392.5"/></g><g class="dg-trg dg-trk-ok" data-tr="X4&gt;X1"><path class="dg-tr" d="M120 362 L120 296.5"/><path class="dg-tr" d="M120 247.5 L120 187"/><polygon class="dg-head" points="120,182 115.5,191.5 124.5,191.5"/></g><g class="dg-trg" data-tr="X4&gt;X4"><path class="dg-tr" d="M90 432 L90 451 Q90 460 99 460 L171 460 Q180 460 180 451 L180 437"/><polygon class="dg-head" points="180,432 175.5,441.5 184.5,441.5"/></g><g class="dg-state dg-k-ok" data-state="X1"><rect class="dg-st-rect" x="40" y="112" width="300" height="70" rx="9"/><rect class="dg-st-chip" x="50" y="121" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="63.6" y="134.5" text-anchor="middle">X1</text><text class="dg-st-title" x="85.2" y="135.5">NORMAL</text><text class="dg-st-do" x="52" y="157">All checkpoints agree</text><text class="dg-st-do" x="52" y="172">stack light <tspan class="dg-tag">LT-01</tspan> green</text></g><g class="dg-state dg-k-warn" data-state="X2"><rect class="dg-st-rect" x="520" y="112" width="300" height="70" rx="9"/><rect class="dg-st-chip" x="530" y="121" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="543.6" y="134.5" text-anchor="middle">X2</text><text class="dg-st-title" x="565.2" y="135.5">MISMATCH WARNING</text><text class="dg-st-do" x="532" y="157">1–2 mismatches in the last 10 min</text><text class="dg-st-do" x="532" y="172">camera value used · amber flashing</text></g><g class="dg-state dg-k-stop" data-state="X3"><rect class="dg-st-rect" x="520" y="362" width="300" height="70" rx="9"/><rect class="dg-st-chip" x="530" y="371" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="543.6" y="384.5" text-anchor="middle">X3</text><text class="dg-st-title" x="565.2" y="385.5">LINE STOP</text><text class="dg-st-do" x="532" y="407">Controlled stop: robots finish the step</text><text class="dg-st-do" x="532" y="422">and park, belt stops · red light</text></g><g class="dg-state dg-k-check" data-state="X4"><rect class="dg-st-rect" x="40" y="362" width="300" height="70" rx="9"/><rect class="dg-st-chip" x="50" y="371" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="63.6" y="384.5" text-anchor="middle">X4</text><text class="dg-st-title" x="85.2" y="385.5">SENSOR VERIFICATION</text><text class="dg-st-do" x="52" y="407">Technician cleans and aligns sensors,</text><text class="dg-st-do" x="52" y="422">tests each CP, checks camera calibration</text></g><circle class="dg-init" cx="20" cy="90" r="7.5"/><rect class="dg-note-rect" x="520" y="454" width="300" height="66" rx="6"/><text class="dg-note" x="532" y="477"><tspan class="dg-b">The camera never overrides safety:</tspan></text><text class="dg-note" x="532" y="493">door interlock, E-stops and scanners</text><text class="dg-note" x="532" y="509">stay hardwired to the safety relay.</text><text class="dg-guard dg-halo" x="420" y="302.5" text-anchor="middle"><tspan x="420">camera fault (after 1 retry)</tspan></text><text class="dg-guard dg-halo" x="430" y="127" text-anchor="middle"><tspan x="430">mismatch at any CP</tspan></text><text class="dg-guard dg-halo" x="670" y="269" text-anchor="middle"><tspan x="670">3rd mismatch within 10 min</tspan><tspan x="670" dy="15">or camera fault (after 1 retry)</tspan></text><text class="dg-guard dg-halo" x="430" y="185.5" text-anchor="middle"><tspan x="430">no mismatch for 10 min</tspan><tspan x="430" dy="15">(window empty)</tspan></text><text class="dg-guard dg-halo" x="430" y="421.5" text-anchor="middle"><tspan x="430">all stopped · technician</tspan><tspan x="430" dy="15">starts the check</tspan></text><text class="dg-guard dg-halo" x="120" y="261.5" text-anchor="middle"><tspan x="120">all CP tests pass</tspan><tspan x="120" dy="15">operator reset</tspan><tspan x="120" dy="15">→ counter cleared</tspan></text><text class="dg-guard dg-halo" x="135" y="478.5" text-anchor="middle"><tspan x="135">test fails → repair or replace the sensor, re-test</tspan></text></svg>