</style><rect class="dg-bg" x="0" y="0" width="900" height="588"/><text class="dg-title" x="20" y="36">Control architecture: four state machines in the cell PLC</text><text class="dg-sub" x="20" y="58">Each state machine moves only on its own sensors plus the handshake signals written on the arrows.</text><rect x="22" y="248" width="856" height="324" rx="12" fill="none" stroke="var(--dg-rule,#aab4be)" stroke-width="1.4" stroke-dasharray="6 5"/><text class="dg-band-label" x="38" y="562">CELL PLC-01 · runs the 4 state machines</text><g class="dg-trg"><path class="dg-tr" d="M120 274 L120 161"/><polygon class="dg-head" points="120,156 115.5,165.5 124.5,165.5"/></g><g class="dg-trg"><path class="dg-tr" d="M200 156 L200 269"/><polygon class="dg-head" points="200,274 204.5,264.5 195.5,264.5"/></g><g class="dg-trg"><path class="dg-tr" d="M280 304 L355 304"/><polygon class="dg-head" points="360,304 350.5,299.5 350.5,308.5"/></g><g class="dg-trg"><path class="dg-tr" d="M360 336 L285 336"/><polygon class="dg-head" points="280,336 289.5,340.5 289.5,331.5"/></g><g class="dg-trg"><path class="dg-tr" d="M540 304 L615 304"/><polygon class="dg-head" points="620,304 610.5,299.5 610.5,308.5"/></g><g class="dg-trg"><path class="dg-tr" d="M620 336 L545 336"/><polygon class="dg-head" points="540,336 549.5,340.5 549.5,331.5"/></g><g class="dg-trg"><path class="dg-tr" d="M700 156 L700 269"/><polygon class="dg-head" points="700,274 704.5,264.5 695.5,264.5"/></g><g class="dg-trg"><path class="dg-tr" d="M780 274 L780 161"/><polygon class="dg-head" points="780,156 775.5,165.5 784.5,165.5"/></g><g class="dg-trg"><path class="dg-tr" d="M138 366 L138 457"/><polygon class="dg-head" points="138,462 142.5,452.5 133.5,452.5"/></g><g class="dg-trg dg-trk-hold"><path class="dg-tr dg-dash" d="M182 462 L182 371"/><polygon class="dg-head" points="182,366 177.5,375.5 186.5,375.5"/></g><g class="dg-trg"><path class="dg-tr" d="M428 366 L428 457"/><polygon class="dg-head" points="428,462 432.5,452.5 423.5,452.5"/></g><g class="dg-trg dg-trk-hold"><path class="dg-tr dg-dash" d="M472 462 L472 371"/><polygon class="dg-head" points="472,366 467.5,375.5 476.5,375.5"/></g><g class="dg-trg"><path class="dg-tr" d="M718 366 L718 457"/><polygon class="dg-head" points="718,462 722.5,452.5 713.5,452.5"/></g><g class="dg-trg dg-trk-hold"><path class="dg-tr dg-dash" d="M762 462 L762 371"/><polygon class="dg-head" points="762,366 757.5,375.5 766.5,375.5"/></g><g class="dg-nodeg" data-state="CNC"><rect class="dg-node " x="40" y="82" width="240" height="74" rx="6"/><text class="dg-node-t" x="160" y="108.5" text-anchor="middle">CNC + DOOR KIT</text><text class="dg-node-s" x="160" y="124" text-anchor="middle">robot interface · <tspan class="dg-tag">ZS-31</tspan> <tspan class="dg-tag">ZS-32</tspan> <tspan class="dg-tag">ZS-33</tspan></text><text class="dg-node-s" x="160" y="139.5" text-anchor="middle">vise <tspan class="dg-tag">ZS-34</tspan> <tspan class="dg-tag">ZS-35</tspan> · <tspan class="dg-tag">PS-36</tspan></text></g><g class="dg-nodeg" data-state="OP"><rect class="dg-node op" x="620" y="82" width="240" height="74" rx="6"/><text class="dg-node-t" x="740" y="108.5" text-anchor="middle">OPERATOR / HMI</text><text class="dg-node-s" x="740" y="124" text-anchor="middle">loads input pallet (<tspan class="dg-tag">PX-11</tspan>, <tspan class="dg-cp">CP-1</tspan>)</text><text class="dg-node-s" x="740" y="139.5" text-anchor="middle">swaps output pallet · resets</text></g><g class="dg-nodeg" data-state="SM1"><rect class="dg-node " x="40" y="274" width="240" height="92" rx="6"/><text class="dg-node-t" x="160" y="301.8" text-anchor="middle">SM-1  ROBOT 1 + CNC</text><text class="dg-node-s" x="160" y="317.3" text-anchor="middle">states A0–A8 (Setup 1)</text><text class="dg-node-s" x="160" y="332.8" text-anchor="middle">or B0–B7 (Setup 2)</text><text class="dg-node-s" x="160" y="348.3" text-anchor="middle"><tspan class="dg-tag">PX-11</tspan> <tspan class="dg-tag">CAM-1</tspan> <tspan class="dg-tag">GR-21</tspan></text></g><g class="dg-nodeg" data-state="SM2"><rect class="dg-node " x="360" y="274" width="180" height="92" rx="6"/><text class="dg-node-t" x="450" y="301.8" text-anchor="middle">SM-2  CONVEYOR</text><text class="dg-node-s" x="450" y="317.3" text-anchor="middle">states C1–C5</text><text class="dg-node-s" x="450" y="332.8" text-anchor="middle"><tspan class="dg-tag">PE-41</tspan> <tspan class="dg-tag">PE-42</tspan></text><text class="dg-node-s" x="450" y="348.3" text-anchor="middle"><tspan class="dg-tag">ENC-43</tspan></text></g><g class="dg-nodeg" data-state="SM3"><rect class="dg-node " x="620" y="274" width="240" height="92" rx="6"/><text class="dg-node-t" x="740" y="301.8" text-anchor="middle">SM-3  ROBOT 2 + PALLET</text><text class="dg-node-s" x="740" y="317.3" text-anchor="middle">states D0–D4 (Setup 1)</text><text class="dg-node-s" x="740" y="332.8" text-anchor="middle">or E0–E7 (Setup 2)</text><text class="dg-node-s" x="740" y="348.3" text-anchor="middle"><tspan class="dg-tag">CAM-2</tspan> <tspan class="dg-tag">GR-51</tspan> <tspan class="dg-tag">PX-52</tspan></text></g><g class="dg-nodeg" data-state="SM4"><rect class="dg-node " x="40" y="462" width="820" height="76" rx="6"/><text class="dg-node-t" x="450" y="489.5" text-anchor="middle">SM-4  CROSS-CHECK SUPERVISOR  (states X1–X4)</text><text class="dg-node-s" x="450" y="505" text-anchor="middle">compares proximity vs camera at CP-1 … CP-5 · counts mismatches in a 10-min window</text><text class="dg-node-s" x="450" y="520.5" text-anchor="middle">commands LINE STOP after 3 mismatches in 10 min</text></g><text class="dg-guard dg-halo" x="114" y="204.5" text-anchor="end"><tspan x="114">cycle start,</tspan><tspan x="114" dy="15">door + vise</tspan><tspan x="114" dy="15">requests</tspan></text><text class="dg-guard dg-halo" x="206" y="204.5" text-anchor="start"><tspan x="206">cycle complete,</tspan><tspan x="206" dy="15">spindle stopped,</tspan><tspan x="206" dy="15">door + vise state</tspan></text><text class="dg-guard dg-halo" x="320" y="277" text-anchor="middle"><tspan x="320">part placed</tspan><tspan x="320" dy="15">R1 clear</tspan></text><text class="dg-guard dg-halo" x="320" y="357" text-anchor="middle"><tspan x="320">belt</tspan><tspan x="320" dy="15">stopped</tspan></text><text class="dg-guard dg-halo" x="580" y="277" text-anchor="middle"><tspan x="580">pick allowed</tspan><tspan x="580" dy="15">+ pick pose</tspan></text><text class="dg-guard dg-halo" x="580" y="357" text-anchor="middle"><tspan x="580">part picked</tspan><tspan x="580" dy="15">R2 clear</tspan></text><text class="dg-guard dg-halo" x="694" y="204.5" text-anchor="end"><tspan x="694">pallet</tspan><tspan x="694" dy="15">swapped</tspan><tspan x="694" dy="15">(<tspan class="dg-tag">PX-52</tspan>)</tspan></text><text class="dg-guard dg-halo" x="786" y="212" text-anchor="start"><tspan x="786"><tspan class="dg-tag">LT-53</tspan></tspan><tspan x="786" dy="15">pallet full</tspan></text><text class="dg-guard dg-halo" x="132" y="418.5" text-anchor="end"><tspan x="132">CP results</tspan></text><text class="dg-guard dg-halo" x="768" y="411" text-anchor="start"><tspan x="768">LINE STOP</tspan><tspan x="768" dy="15">/ resume</tspan></text></svg>