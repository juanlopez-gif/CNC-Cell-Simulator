</style><rect class="dg-bg" x="0" y="0" width="844" height="753"/><text class="dg-title" x="20" y="36">State diagram: Robot 2 + output pallet (Setup 1)</text><text class="dg-sub" x="20" y="58">The blue light <tspan class="dg-tag">LT-53</tspan> is the "pallet ready for pickup" signal required by the assignment.</text><g class="dg-trg"><path class="dg-tr" d="M290 93 L290 130"/><polygon class="dg-head" points="290,135 294.5,125.5 285.5,125.5"/></g><g class="dg-trg"><path class="dg-tr" d="M290 205 L290 241"/><polygon class="dg-head" points="290,246 294.5,236.5 285.5,236.5"/></g><g class="dg-trg"><path class="dg-tr" d="M290 301 L290 337"/><polygon class="dg-head" points="290,342 294.5,332.5 285.5,332.5"/></g><g class="dg-trg"><path class="dg-tr" d="M290 412 L290 463"/><polygon class="dg-head" points="290,468 294.5,458.5 285.5,458.5"/></g><g class="dg-trg"><path class="dg-tr" d="M290 538 L290 572"/><polygon class="dg-head" points="290,577 294.5,567.5 285.5,567.5"/></g><g class="dg-trg"><path class="dg-tr" d="M202 610 L47 610 Q38 610 38 601 L38 282.5 Q38 273.5 47 273.5 L105 273.5"/><polygon class="dg-head" points="110,273.5 100.5,269 100.5,278"/></g><g class="dg-trg dg-trk-ok"><path class="dg-tr" d="M378 610 L569 610"/><polygon class="dg-head" points="574,610 564.5,605.5 564.5,614.5"/></g><g class="dg-trg"><path class="dg-tr" d="M699 568 L699 559 Q699 550 690 550 L529 550 Q520 550 520 541 L520 282.5 Q520 273.5 511 273.5 L475 273.5"/><polygon class="dg-head" points="470,273.5 479.5,278 479.5,269"/></g><g class="dg-trg dg-trk-fault"><path class="dg-tr dg-dash" d="M540 170 L569 170"/><polygon class="dg-head" points="574,170 564.5,165.5 564.5,174.5"/></g><g class="dg-trg dg-trk-hold"><path class="dg-tr dg-dash" d="M540 256 L569 256"/><polygon class="dg-head" points="574,256 564.5,251.5 564.5,260.5"/></g><circle class="dg-init" cx="290" cy="86" r="7.5"/><g class="dg-state" data-state="D0"><rect class="dg-st-rect" x="110" y="135" width="360" height="70" rx="9"/><rect class="dg-st-chip" x="120" y="144" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="133.6" y="157.5" text-anchor="middle">D0</text><text class="dg-st-title" x="155.2" y="158.5">START-UP CHECKS</text><text class="dg-st-do" x="122" y="180">Home · <tspan class="dg-cp">CP-4</tspan> pallet present (<tspan class="dg-tag">PX-52</tspan> + <tspan class="dg-tag">CAM-2</tspan>)</text><text class="dg-st-do" x="122" y="195"><tspan class="dg-tag">CAM-2</tspan> reads the slot map, sets the count</text></g><g class="dg-state" data-state="D1"><rect class="dg-st-rect" x="110" y="246" width="360" height="55" rx="9"/><rect class="dg-st-chip" x="120" y="255" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="133.6" y="268.5" text-anchor="middle">D1</text><text class="dg-st-title" x="155.2" y="269.5">WAIT FOR PART</text><text class="dg-st-do" x="122" y="291">Robot at home, clear of the conveyor</text></g><g class="dg-state" data-state="D2"><rect class="dg-st-rect" x="110" y="342" width="360" height="70" rx="9"/><rect class="dg-st-chip" x="120" y="351" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="133.6" y="364.5" text-anchor="middle">D2</text><text class="dg-st-title" x="155.2" y="365.5">PICK FROM CONVEYOR</text><text class="dg-st-do" x="122" y="387">Belt stopped (<tspan class="dg-tag">ENC-43</tspan> = 0) · move to the</text><text class="dg-st-do" x="122" y="402">pick pose · grip · lift · retract</text></g><g class="dg-state" data-state="D3"><rect class="dg-st-rect" x="110" y="468" width="360" height="70" rx="9"/><rect class="dg-st-chip" x="120" y="477" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="133.6" y="490.5" text-anchor="middle">D3</text><text class="dg-st-title" x="155.2" y="491.5">PLACE ON OUTPUT PALLET</text><text class="dg-st-do" x="122" y="513"><tspan class="dg-cp">CP-4</tspan> pallet present (<tspan class="dg-tag">PX-52</tspan> + <tspan class="dg-tag">CAM-2</tspan>) ·</text><text class="dg-st-do" x="122" y="528"><tspan class="dg-tag">CAM-2</tspan> next free slot · place · release</text></g><g class="dg-choiceg" data-state="Q1"><polygon class="dg-choice" points="290,577 378,610 290,643 202,610"/><text class="dg-choice-t" x="290" y="607.5" text-anchor="middle">Output pallet</text><text class="dg-choice-t" x="290" y="622.5" text-anchor="middle">full?</text></g><g class="dg-state dg-k-op" data-state="D4"><rect class="dg-st-rect" x="574" y="568" width="250" height="85" rx="9"/><rect class="dg-st-chip" x="584" y="577" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="597.6" y="590.5" text-anchor="middle">D4</text><text class="dg-st-title" x="619.2" y="591.5">PALLET FULL - WAIT FOR SWAP</text><text class="dg-st-do" x="586" y="613"><tspan class="dg-tag">LT-53</tspan> blue light ON · wait for</text><text class="dg-st-do" x="586" y="628">the swap: <tspan class="dg-tag">PX-52</tspan> OFF → ON and</text><text class="dg-st-do" x="586" y="643"><tspan class="dg-tag">CAM-2</tspan> sees an empty pallet</text></g><g class="dg-state dg-k-fault" data-state="F"><rect class="dg-st-rect" x="574" y="135" width="250" height="70" rx="9"/><rect class="dg-st-chip" x="584" y="144" width="19.6" height="19" rx="4"/><text class="dg-st-chiptext" x="593.8" y="157.5" text-anchor="middle">F</text><text class="dg-st-title" x="611.6" y="158.5">FAULT</text><text class="dg-st-do" x="586" y="180">From any state: timeout or a</text><text class="dg-st-do" x="586" y="195">missing confirmation · red light</text></g><g class="dg-state dg-k-hold" data-state="H"><rect class="dg-st-rect" x="574" y="221" width="250" height="70" rx="9"/><rect class="dg-st-chip" x="584" y="230" width="19.6" height="19" rx="4"/><text class="dg-st-chiptext" x="593.8" y="243.5" text-anchor="middle">H</text><text class="dg-st-title" x="611.6" y="244.5">HOLD (LINE STOP)</text><text class="dg-st-do" x="586" y="266">LINE STOP: finish the step,</text><text class="dg-st-do" x="586" y="281">park, wait for the reset</text></g><rect class="dg-note-rect" x="20" y="669" width="804" height="66" rx="6"/><text class="dg-note" x="32" y="692"><tspan class="dg-b">F FAULT</tspan> and <tspan class="dg-b">H HOLD</tspan> can be entered from any state. FAULT = a confirmation is missing or a timeout</text><text class="dg-note" x="32" y="708">expired (the alarm names the sensor, no automatic robot retries). HOLD = LINE STOP from the cross-check</text><text class="dg-note" x="32" y="724">supervisor: the current step is finished, the robot parks, and it resumes at the same step after the reset.</text><text class="dg-guard dg-halo" x="290" y="118.5" text-anchor="middle"><tspan x="290">Auto mode ON</tspan></text><text class="dg-guard dg-halo" x="290" y="230" text-anchor="middle"><tspan x="290">Robot home · pallet present · free slots</tspan></text><text class="dg-guard dg-halo" x="290" y="326" text-anchor="middle"><tspan x="290">Conveyor in C5: "pick allowed" + pick pose (<tspan class="dg-tag">CAM-2</tspan>)</tspan></text><text class="dg-guard dg-halo" x="290" y="437" text-anchor="middle"><tspan x="290"><tspan class="dg-tag">GR-51</tspan> grip OK · <tspan class="dg-cp">CP-3</tspan> exit clear</tspan><tspan x="290" dy="15">R2 clear of conveyor</tspan></text><text class="dg-guard dg-halo" x="290" y="562" text-anchor="middle"><tspan x="290"><tspan class="dg-tag">CAM-2</tspan>: slot occupied · count + 1</tspan></text><text class="dg-guard dg-halo" x="126" y="601.5" text-anchor="middle"><tspan x="126">No: count &lt; 12</tspan></text><text class="dg-guard dg-halo" x="472" y="575" text-anchor="middle"><tspan x="472">Yes: count = 12</tspan><tspan x="472" dy="15"><tspan class="dg-tag">CAM-2</tspan>: all slots full</tspan></text><text class="dg-guard dg-halo" x="520" y="436.3" text-anchor="middle" transform="rotate(-90 520 431.8)"><tspan x="520">pallet swapped → count = 0 · <tspan class="dg-tag">LT-53</tspan> OFF</tspan></text></svg>