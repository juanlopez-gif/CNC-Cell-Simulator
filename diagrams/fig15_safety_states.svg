</style><rect class="dg-bg" x="0" y="0" width="1100" height="946"/><text class="dg-title" x="20" y="36">State diagram: safety status (E-stop and laser scanners)</text><text class="dg-sub" x="20" y="58">The safety relay, the scanners and the robot controllers stop the motion; the PLC follows their status and recovers.</text><g class="dg-trg"><path class="dg-tr" d="M20 308 L20 334.5 Q20 342 27.5 342 L35 342"/><polygon class="dg-head" points="40,342 30.5,337.5 30.5,346.5"/></g><g class="dg-trg dg-trk-fault" data-tr="S1&gt;S4"><path class="dg-tr" d="M290 357 L805 357"/><polygon class="dg-head" points="810,357 800.5,352.5 800.5,361.5"/></g><g class="dg-trg" data-tr="S1&gt;S3"><path class="dg-tr" d="M125 392 L125 551.5 Q125 560.5 134 560.5 L420 560.5"/><polygon class="dg-head" points="425,560.5 415.5,556 415.5,565"/></g><g class="dg-trg" data-tr="S1&gt;S2"><path class="dg-tr" d="M125 322 L125 142 Q125 133 134 133 L420 133"/><polygon class="dg-head" points="425,133 415.5,128.5 415.5,137.5"/></g><g class="dg-trg dg-trk-fault" data-tr="S2&gt;S4"><path class="dg-tr" d="M675 147 L926 147 Q935 147 935 156 L935 317"/><polygon class="dg-head" points="935,322 939.5,312.5 930.5,312.5"/></g><g class="dg-trg" data-tr="S2&gt;S3"><path class="dg-tr" d="M505 182 L505 527"/><polygon class="dg-head" points="505,532 509.5,522.5 500.5,522.5"/></g><g class="dg-trg dg-trk-ok" data-tr="S2&gt;S1"><path class="dg-tr" d="M425 161 L214 161 Q205 161 205 170 L205 317"/><polygon class="dg-head" points="205,322 209.5,312.5 200.5,312.5"/></g><g class="dg-trg dg-trk-fault" data-tr="S3&gt;S4"><path class="dg-tr" d="M675 574.5 L926 574.5 Q935 574.5 935 565.5 L935 397"/><polygon class="dg-head" points="935,392 930.5,401.5 939.5,401.5"/></g><g class="dg-trg" data-tr="S3&gt;S2"><path class="dg-tr" d="M595 532 L595 187"/><polygon class="dg-head" points="595,182 590.5,191.5 599.5,191.5"/></g><g class="dg-trg dg-trk-ok" data-tr="S3&gt;S1"><path class="dg-tr" d="M425 588.5 L214 588.5 Q205 588.5 205 579.5 L205 397"/><polygon class="dg-head" points="205,392 200.5,401.5 209.5,401.5"/></g><g class="dg-trg" data-tr="S4&gt;S5"><path class="dg-tr" d="M895 392 L895 764 Q895 773 886 773 L680 773"/><polygon class="dg-head" points="675,773 684.5,777.5 684.5,768.5"/></g><g class="dg-trg dg-trk-fault" data-tr="S5&gt;S4"><path class="dg-tr" d="M675 801 L966 801 Q975 801 975 792 L975 397"/><polygon class="dg-head" points="975,392 970.5,401.5 979.5,401.5"/></g><g class="dg-trg dg-trk-ok" data-tr="S5&gt;S1"><path class="dg-tr" d="M425 787 L174 787 Q165 787 165 778 L165 397"/><polygon class="dg-head" points="165,392 160.5,401.5 169.5,401.5"/></g><g class="dg-state dg-k-ok" data-state="S1"><rect class="dg-st-rect" x="40" y="322" width="250" height="70" rx="9"/><rect class="dg-st-chip" x="50" y="331" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="63.6" y="344.5" text-anchor="middle">S1</text><text class="dg-st-title" x="85.2" y="345.5">RUN</text><text class="dg-st-do" x="52" y="367">No person in a field</text><text class="dg-st-do" x="52" y="382">full robot speed</text></g><g class="dg-state dg-k-warn" data-state="S2"><rect class="dg-st-rect" x="425" y="112" width="250" height="70" rx="9"/><rect class="dg-st-chip" x="435" y="121" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="448.6" y="134.5" text-anchor="middle">S2</text><text class="dg-st-title" x="470.2" y="135.5">REDUCED SPEED</text><text class="dg-st-do" x="437" y="157">A person in a warning field:</text><text class="dg-st-do" x="437" y="172">that robot at half speed · amber</text></g><g class="dg-state dg-k-warn" data-state="S3"><rect class="dg-st-rect" x="425" y="532" width="250" height="85" rx="9"/><rect class="dg-st-chip" x="435" y="541" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="448.6" y="554.5" text-anchor="middle">S3</text><text class="dg-st-title" x="470.2" y="555.5">PROTECTIVE STOP</text><text class="dg-st-do" x="437" y="577">A person in the protective field</text><text class="dg-st-do" x="437" y="592">where a robot works: it pauses,</text><text class="dg-st-do" x="437" y="607">resumes when the field is clear</text></g><g class="dg-state dg-k-stop" data-state="S4"><rect class="dg-st-rect" x="810" y="322" width="250" height="70" rx="9"/><rect class="dg-st-chip" x="820" y="331" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="833.6" y="344.5" text-anchor="middle">S4</text><text class="dg-st-title" x="855.2" y="345.5">EMERGENCY STOP</text><text class="dg-st-do" x="822" y="367">All motion stopped · robots and</text><text class="dg-st-do" x="822" y="382">conveyor in FAULT · CNC feed hold</text></g><g class="dg-state dg-k-check" data-state="S5"><rect class="dg-st-rect" x="425" y="752" width="250" height="70" rx="9"/><rect class="dg-st-chip" x="435" y="761" width="27.2" height="19" rx="4"/><text class="dg-st-chiptext" x="448.6" y="774.5" text-anchor="middle">S5</text><text class="dg-st-title" x="470.2" y="775.5">RESET REQUIRED</text><text class="dg-st-do" x="437" y="797">E-stop released: operator resets</text><text class="dg-st-do" x="437" y="812">the relay, then clears the FAULTs</text></g><circle class="dg-init" cx="20" cy="300" r="7.5"/><rect class="dg-note-rect" x="810" y="862" width="250" height="66" rx="6"/><text class="dg-note" x="822" y="885"><tspan class="dg-b">Not a safety function:</tspan> the stop is done by</text><text class="dg-note" x="822" y="901">the relay, the scanners and the robot</text><text class="dg-note" x="822" y="917">controllers; this machine reads their status.</text><text class="dg-guard dg-halo" x="550" y="351" text-anchor="middle"><tspan x="550">E-stop pressed</tspan></text><text class="dg-guard dg-halo" x="275" y="509.5" text-anchor="middle"><tspan x="275">Robot 1 in a protective</tspan><tspan x="275" dy="15">stop</tspan><tspan x="275" dy="15">or Robot 2 in a protective</tspan><tspan x="275" dy="15">stop</tspan></text><text class="dg-guard dg-halo" x="275" y="82" text-anchor="middle"><tspan x="275"><tspan class="dg-tag">SC-01</tspan> warning field</tspan><tspan x="275" dy="15">occupied</tspan><tspan x="275" dy="15">or <tspan class="dg-tag">SC-02</tspan> warning field</tspan><tspan x="275" dy="15">occupied</tspan></text><text class="dg-guard dg-halo" x="805" y="167.5" text-anchor="middle"><tspan x="805">E-stop pressed</tspan></text><text class="dg-guard dg-halo" x="497" y="269" text-anchor="end"><tspan x="497">Robot 1 in a</tspan><tspan x="497" dy="15">protective stop</tspan><tspan x="497" dy="15">or Robot 2 in a</tspan><tspan x="497" dy="15">protective stop</tspan></text><text class="dg-guard dg-halo" x="315" y="181.5" text-anchor="middle"><tspan x="315"><tspan class="dg-tag">SC-01</tspan> warning field clear</tspan><tspan x="315" dy="15"><tspan class="dg-tag">SC-02</tspan> warning field clear</tspan></text><text class="dg-guard dg-halo" x="805" y="595" text-anchor="middle"><tspan x="805">E-stop pressed</tspan></text><text class="dg-guard dg-halo" x="603" y="401.5" text-anchor="start"><tspan x="603">Robot 1 not stopped</tspan><tspan x="603" dy="15">Robot 2 not stopped</tspan><tspan x="603" dy="15"><tspan class="dg-tag">SC-01</tspan> warning field</tspan><tspan x="603" dy="15">occupied or <tspan class="dg-tag">SC-02</tspan></tspan><tspan x="603" dy="15">warning field occupied</tspan></text><text class="dg-guard dg-halo" x="315" y="609" text-anchor="middle"><tspan x="315">Robot 1 not stopped</tspan><tspan x="315" dy="15">Robot 2 not stopped</tspan><tspan x="315" dy="15"><tspan class="dg-tag">SC-01</tspan> warning field clear</tspan><tspan x="315" dy="15"><tspan class="dg-tag">SC-02</tspan> warning field clear</tspan></text><text class="dg-guard dg-halo" x="785" y="767" text-anchor="middle"><tspan x="785">E-stop released</tspan></text><text class="dg-guard dg-halo" x="825" y="821.5" text-anchor="middle"><tspan x="825">E-stop pressed</tspan></text><text class="dg-guard dg-halo" x="295" y="807.5" text-anchor="middle"><tspan x="295">relay reset: operator</tspan><tspan x="295" dy="15">resets the safety relay</tspan></text></svg>