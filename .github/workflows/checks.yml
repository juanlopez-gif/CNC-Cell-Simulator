# Checks on every push and pull request, from a clean install (see PROJECT_STATUS.md §11).
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        working-directory: source
        run: npm ci

      - name: Model lint and generated files (figures, simulator, model JSON, NuSMV models)
        working-directory: source
        run: npm run check

      - name: Python engine tests
        working-directory: engine
        run: python -m unittest -v test_engine

      - name: Exhaustive verification, nominal run
        working-directory: source
        run: ONLY=setup2_none node --max-old-space-size=6000 verify.js

      - name: Browser tests (basic, fault, quality hold, phone width, conformance, Python parity)
        working-directory: source
        run: |
          node build_sim.js
          node test_sim.js all

      - name: Regression against the Setup 2 reference
        working-directory: source
        run: npm run regress

  plc:
    # the generated Structured Text (source/plc/cell.st, step A3.2) must compile with matiec, the
    # IEC 61131-3 compiler that OpenPLC uses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build matiec
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool flex bison g++ make
          git clone --depth 1 https://github.com/beremiz/matiec.git "$RUNNER_TEMP/matiec"
          cd "$RUNNER_TEMP/matiec"
          git log -1 --format='matiec %H %cs'
          autoreconf -i
          ./configure
          make -j4

      - name: Compile the PLC program
        working-directory: source/plc
        run: |
          mkdir -p "$RUNNER_TEMP/st_out"
          "$RUNNER_TEMP/matiec/iec2c" -I "$RUNNER_TEMP/matiec/lib" -T "$RUNNER_TEMP/st_out" cell.st
          ls -l "$RUNNER_TEMP/st_out"
