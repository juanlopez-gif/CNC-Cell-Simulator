# Step A3.3 (PROJECT_STATUS.md §5.16, §15): the generated PLC program (source/plc/cell.st) runs in the
# OpenPLC runtime and controls the plant of the Python engine through the Modbus bridge
# (engine/cellsim/plc_bridge.py). A software PLC controlling a simulated cell, not industrial hardware.
name: plc run

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of operation (real time)
        default: "900"
  push:
    branches: [a3-plc]
    paths:
      - source/plc/**
      - engine/cellsim/**
      - .github/workflows/plc-run.yml

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      SECONDS_RUN: ${{ inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the OpenPLC runtime
        run: |
          git clone --depth 1 https://github.com/thiagoralves/OpenPLC_v3.git "$RUNNER_TEMP/OpenPLC_v3"
          cd "$RUNNER_TEMP/OpenPLC_v3"
          git log -1 --format='OpenPLC_v3 %H %cs'
          ./install.sh linux > "$RUNNER_TEMP/openplc_install.log" 2>&1 || { tail -50 "$RUNNER_TEMP/openplc_install.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/openplc_install.log"

      - name: Compile the cell program for OpenPLC
        run: |
          W="$RUNNER_TEMP/OpenPLC_v3/webserver"
          cp source/plc/cell.st "$W/st_files/cell.st"
          cd "$W"
          ./scripts/compile_program.sh cell.st
          ls -l core/openplc

      - name: Bridge dependencies
        run: python -m pip install pymodbus==3.6.9

      - name: Run the PLC against the plant
        working-directory: engine
        run: |
          W="$RUNNER_TEMP/OpenPLC_v3/webserver"
          python -m cellsim.plc_bridge --mbconfig "$W/mbconfig.cfg"
          touch "$W/persistent.file"
          python -m cellsim.plc_bridge --seconds "$SECONDS_RUN" --out plc_run.json &
          BRIDGE=$!
          sleep 3
          (cd "$W" && exec ./core/openplc > "$RUNNER_TEMP/openplc.log" 2>&1) &
          PLC=$!
          set +e
          wait $BRIDGE
          STATUS=$?
          kill $PLC 2>/dev/null
          tail -20 "$RUNNER_TEMP/openplc.log"
          exit $STATUS

      - name: Check the run
        working-directory: engine
        run: |
          python - <<'EOF'
          import json
          r = json.load(open("plc_run.json"))
          m = r["measures"]
          print(f"{r['seconds']} s, {r['cycles']} CNC cycles, {m['parts_out']} parts out, mean CNC idle {m['mean_cnc_idle_s']} s")
          print("PLC faults:", r["plc_faults"])
          print("plant errors:", r["errors"][:10])
          print("property violations:", r["violations"])
          ok = r["cycles"] >= 2 and not r["plc_faults"] and not r["errors"] and r["violations"] == 0
          raise SystemExit(0 if ok else 1)
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plc-run
          path: |
            engine/plc_run.json
            ${{ runner.temp }}/openplc.log
            ${{ runner.temp }}/openplc_install.log
